services:
  postgres:
    image: postgres:16-alpine
    container_name: medline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medline
      POSTGRES_PASSWORD: medline
      POSTGRES_DB: medline_ops
    ports:
      - "5432:5432"
    volumes:
      - medline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medline -d medline_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medline_pgdata:
